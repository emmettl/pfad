name: Check PFAD
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: pfad-preview
          path: dist
          retention-days: 7
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit-mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pfad-preview
          path: dist
      # Switch the slow Azure package mirror to Ubuntu's main mirror before
      # installing WebKit runtime libraries. Keep both browser engines checked.
      - run: |
          shopt -s nullglob
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          if [ "${{ matrix.browser }}" = chromium ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps webkit
          fi
      # Separate hosts give each engine its own CPU/RAM budget. National WebGL
      # scenes stay serial within a runner; both engines run at the same time.
      - run: npm run test:browser -- --project=${{ matrix.browser }} --workers=1 --max-failures=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pfad-browser-${{ matrix.browser }}
          path: test-results
          retention-days: 7
