name: Check PFAD
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci
      - run: npm run check
      # Switch the slow Azure package mirror to Ubuntu's main mirror before
      # installing WebKit runtime libraries. Keep both browser engines checked.
      - run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --workers=1
      - uses: actions/upload-artifact@v7
        with:
          name: pfad-preview
          path: dist
          retention-days: 7
