name: Bootstrap ZENIT Cloudflare credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare
    steps:
      - name: Set up public-key encryption
        run: |
          python3 -m venv /tmp/zenit-seal
          /tmp/zenit-seal/bin/pip install --disable-pip-version-check --quiet PyNaCl==1.5.0
      - name: Seal the existing deployment credential for ZENIT's main-only environment
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECIPIENT_PUBLIC_KEY: 'jYiWeoWToj1snbn+K5TY86vQkfXRtqZqoVxcGS+Ca0Y='
          RECIPIENT_KEY_ID: '3380204578043523366'
        run: |
          /tmp/zenit-seal/bin/python - <<'PYTHON'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          token = os.environ['DEPLOYMENT_TOKEN']
          if not token:
              raise SystemExit('Deployment credential unavailable')
          key = PublicKey(base64.b64decode(os.environ['RECIPIENT_PUBLIC_KEY']))
          encrypted = SealedBox(key).encrypt(token.encode())
          with open('zenit-environment-secret.json', 'w') as f:
              json.dump({'key_id': os.environ['RECIPIENT_KEY_ID'], 'encrypted_value': base64.b64encode(encrypted).decode()}, f)
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: zenit-sealed-environment-secret
          path: zenit-environment-secret.json
          retention-days: 1
